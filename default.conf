[ids]

*

[main]

capslock = layer(capsmod)
f = overload(meta, f)

[capsmod]

j = left
k = down
l = right
i = up
u = home
o = end
space = C-backspace
f = escape
d = C-delete
s = volumeup        
x = volumedown
c = previoussong
v = nextsong
b = playpause
m = backspace
, = delete
; = enter
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
- = f11
= = f12
